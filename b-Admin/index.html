<!doctype html>
<html lang="zh-Hans" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="dark light">
<title>访问统计 · OneHistory</title>
<link rel="icon" href="https://onehistory.exc0.top/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://onehistory.exc0.top/assets/site.css">
<script>
(function(){let t;try{t=localStorage.getItem('oh-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;})();
</script>
<style>
/* Authority: z-OneHistoryID/网站风格.md; fonts and colors come from site.css. */
html{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
.admin{padding-block:clamp(28px,5vw,56px) 48px}
.admin-intro{border-bottom:var(--rule) solid var(--ink);padding-bottom:24px}
.admin-kicker{display:none}
h1{font-size:clamp(30px,4.4vw,42px);font-weight:var(--oh-font-weight-heading);line-height:1.3;margin:0 0 14px}
.admin-intro p:last-child{margin:0;font-size:15.5px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:24px 0}
.controls{display:flex;gap:12px}
.controls button,.controls select{font:inherit;font-weight:var(--oh-font-weight-body);height:40px;padding:0 14px;border:1px solid var(--ink);border-radius:var(--r-ctl);background:transparent;color:var(--text)}
.controls select{background:var(--canvas)}
.controls button:hover{background:var(--ink);color:var(--on-ink)}
.controls button:disabled{color:var(--oh-color-text-disabled);cursor:wait}
#state{font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.box{border:1px solid var(--hairline-2);border-radius:var(--r-card);padding:22px;background:var(--surface);min-width:0}
.label{display:flex;align-items:center;gap:12px;font-size:14px}
.label:after{content:"";flex:1;min-width:12px;height:var(--rule);background:var(--ink)}
.number{font-family:var(--num);font-size:clamp(32px,3.6vw,42px);font-weight:var(--oh-font-weight-heading);font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.5;margin:10px 0 6px}
.admin-hint{font-size:12px}
.trend{margin-top:32px}
.box h2{display:flex;align-items:center;gap:12px;font-size:clamp(20px,2.2vw,24px);font-weight:var(--oh-font-weight-heading);line-height:1.3;margin:0 0 22px;white-space:nowrap}
.box h2:after{content:"";flex:1;min-width:24px;align-self:stretch;background:var(--ink);border-radius:var(--r-bar)}
.legend{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:12px;margin:0 0 8px}
.legend i{display:inline-block;width:12px;height:12px;background:var(--ink);border-radius:2px}
.legend .ips-key{background:var(--oh-color-text-disabled);margin-left:14px}
.chart{height:200px;display:flex;align-items:flex-end;gap:7px;border-bottom:1px solid var(--ink);padding-top:16px}
.column{flex:1;min-width:0;height:100%;display:flex;gap:2px;align-items:flex-end}
.bar{width:50%;min-height:2px;background:var(--ink);border-radius:var(--r-sm) var(--r-sm) 0 0}
.bar.ips{background:var(--oh-color-text-disabled)}
.axis{display:flex;justify-content:space-between;font-family:var(--num);font-size:12px;padding-top:8px}
.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:32px}
.table-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--canvas);border-top:var(--rule) solid var(--ink);border-bottom:1px solid var(--ink)}
th{text-align:left;font-size:13.5px;font-weight:var(--oh-font-weight-heading);border-bottom:1px solid var(--ink)}
td,th{padding:12px 0}
td{border-bottom:1px solid var(--hairline-2)}
td:first-child{overflow-wrap:anywhere}
td:last-child,th:last-child{text-align:right;white-space:nowrap;padding-left:16px}
tr:last-child td{border-bottom:0}
.empty{border:1px solid var(--hairline-2);border-radius:var(--r-card);text-align:center;padding:24px 12px;font-size:15px}
.recent{margin-top:32px}
.admin-note{border-top:var(--rule) solid var(--ink);padding-top:20px;margin:32px 0 0;font-size:13px}
.error{color:var(--oh-color-danger)}
@media(max-width:900px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.admin-grid{grid-template-columns:1fr}.box{padding:18px}.toolbar{align-items:flex-start;flex-direction:column}.chart{gap:3px;height:160px}.number{font-size:32px}.controls{gap:10px}.controls select,.controls button{font-size:15px}.label{font-size:13px;gap:8px}.admin-hint{font-size:12px}.metrics{gap:12px}.metrics .box{padding:16px}.box h2{gap:10px}}
@media(max-width:380px){.metrics{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="skip" href="#stats">跳到访问统计</a>
<header class="nav"><div class="wrap nav-in">
<a class="nav-logo" href="https://onehistory.exc0.top/" aria-label="OneHistory 首页"><img class="logo logo-light" src="https://onehistory.exc0.top/assets/logo.png" alt="OneHistory"><img class="logo logo-dark" src="https://onehistory.exc0.top/assets/logo-dark.png" alt="OneHistory"></a>
<span class="grow"></span><a class="nav-link" href="https://onehistory.exc0.top/">作品</a><a class="nav-link is-on" href="#stats" aria-current="page">访问统计</a>
<button type="button" id="theme" class="icon-btn" aria-label="切换深浅色" title="切换深浅色">
<svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9"/></svg>
<svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>
</button></div></header>
<main class="wrap admin" id="stats">
<div class="admin-intro"><h1>访问统计</h1><p>OneHistory · 访客与页面表现</p></div>
<div class="toolbar"><div class="controls"><select id="days" aria-label="统计时间范围"><option value="7">最近 7 天</option><option value="14" selected>最近 14 天</option><option value="30">最近 30 天</option></select><button id="refresh">刷新数据</button></div><span id="state" role="status">正在读取…</span></div>
<section class="metrics" aria-label="访问概览"><div class="box"><div class="label">今日页面访问</div><div class="number" id="today">—</div><div class="admin-hint">北京时间 00:00 起</div></div><div class="box"><div class="label">期间页面访问</div><div class="number" id="views">—</div><div class="admin-hint">成功返回的页面请求</div></div><div class="box"><div class="label">期间独立 IP</div><div class="number" id="ips">—</div><div class="admin-hint">期间去重，不等于人数</div></div><div class="box"><div class="label">已排除机器人</div><div class="number" id="bots">—</div><div class="admin-hint">依据浏览器标识估算</div></div></section>
<section class="box trend"><h2>每日访问趋势</h2><div class="legend"><i></i>访问量<i class="ips-key"></i>独立 IP</div><div class="chart" id="chart" role="img" aria-label="每日页面访问和独立 IP 柱状图"></div><div class="axis"><span id="start"></span><span id="end"></span></div></section>
<div class="admin-grid"><section class="box"><h2>热门页面</h2><div class="table-scroll" id="pages"></div></section><section class="box"><h2>访问来源</h2><div class="table-scroll" id="sources"></div></section><section class="box"><h2>浏览器分布</h2><div class="table-scroll" id="browsers"></div></section><section class="box"><h2>每日明细</h2><div class="table-scroll" id="daily"></div></section></div>
<section class="box recent"><h2>最近访问</h2><div class="table-scroll" id="recent"></div></section>
<p class="admin-note">数据仅覆盖上海作品站，不含 GitHub 项目库。已排除静态资源、后台访问和可识别的机器人；未知机器人仍可能计入。原始日志按服务器规则每日轮转，保留 14 份，超出保留期的历史无法补回。页面不展示访客 IP。数据最多缓存 30 秒。</p>
</main>
<script src="https://onehistory.exc0.top/assets/site.js"></script>
<script>
const $=id=>document.getElementById(id), fmt=n=>n.toLocaleString('zh-CN');
function table(id,headers,rows){const host=$(id);host.replaceChildren();if(!rows.length){const p=document.createElement('p');p.className='empty';p.textContent='暂无访问数据';host.append(p);return}const t=document.createElement('table'),head=t.createTHead().insertRow();headers.forEach(text=>{const cell=document.createElement('th');cell.textContent=text;head.append(cell)});const body=t.createTBody();rows.forEach(row=>{const tr=body.insertRow();row.forEach(value=>{tr.insertCell().textContent=typeof value==='number'?fmt(value):value})});host.append(t)}
async function load(){const button=$('refresh');button.disabled=true;$('state').textContent='正在读取…';$('state').className='';try{const response=await fetch('/admin/api/stats?days='+$('days').value,{cache:'no-store'});if(!response.ok)throw Error(response.status===401?'登录已过期，请重新打开后台':'读取失败（'+response.status+'）');const d=await response.json();$('today').textContent=fmt(d.daily.at(-1).views);for(const key of ['views','ips','bots'])$(key).textContent=fmt(d.totals[key]);const max=Math.max(1,...d.daily.map(x=>x.views));$('chart').replaceChildren();for(const day of d.daily){const col=document.createElement('div');col.className='column';col.title=day.date+'：'+day.views+' 次访问 / '+day.ips+' 个 IP';for(const key of ['views','ips']){const bar=document.createElement('div');bar.className='bar '+key;bar.style.height=(day[key]/max*100)+'%';col.append(bar)}$('chart').append(col)}$('start').textContent=d.daily[0].date;$('end').textContent=d.daily.at(-1).date;table('pages',['页面','访问量'],d.pages);table('sources',['来源域名','访问量'],d.sources);table('browsers',['浏览器','访问量'],d.browsers);table('daily',['日期','访问 / IP'],d.daily.slice().reverse().map(x=>[x.date,x.views+' / '+x.ips]));table('recent',['时间 / 页面','浏览器'],d.recent.map(x=>[new Date(x.time).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+' · '+x.path,x.browser]));$('state').textContent='更新于 '+new Date(d.updated).toLocaleTimeString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'});}catch(error){$('state').textContent=error.message;$('state').className='error'}finally{button.disabled=false}}
$('days').addEventListener('change',load);$('refresh').addEventListener('click',load);load();
</script>
</body>
</html>
