# Ubuntu: /etc/nginx/sites-available/onehistory；日志格式位于 http 上下文。
log_format onehistory escape=json '{"time":"$time_iso8601","ip":"$remote_addr",'
  '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"referer":"$http_referer","agent":"$http_user_agent","seconds":$request_time}';

server {
    listen 80;
    server_name onehistory.exc0.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/onehistory/current;
        try_files $uri =404;
    }
    location / { return 301 https://onehistory.exc0.top$request_uri; }
}

server {
    listen 80;
    server_name 101.132.190.76;
    return 301 https://onehistory.exc0.top$request_uri;
}

server {
    listen 443 ssl;
    server_name onehistory.exc0.top 101.132.190.76;
    ssl_certificate /etc/letsencrypt/live/onehistory.exc0.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onehistory.exc0.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/onehistory/current;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/onehistory.access.log onehistory;
    error_log /var/log/nginx/onehistory.error.log warn;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml model/gltf-binary application/octet-stream;
    add_header X-Content-Type-Options nosniff always;

    location = /admin { return 302 /admin/; }
    location = /stats/collect {
        proxy_pass http://127.0.0.1:18731;
        proxy_set_header Host $host;
        limit_except POST OPTIONS { deny all; }
    }
    location ^~ /admin/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:18731;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /library { return 302 https://cyx3705.github.io/2026-031/library/$is_args$args; }
    location /library/ { return 302 https://cyx3705.github.io/2026-031$request_uri; }
    location /p/ { return 302 https://cyx3705.github.io/2026-031$request_uri; }
    location = /projects.json { return 302 https://cyx3705.github.io/2026-031/projects.json; }

    location ~ /\. { deny all; }
    location ~ \.template\.html$ { return 404; }
    location /assets/vendor/three-0.170.0/ {
        expires 1y;
        try_files $uri =404;
    }
    location /assets/ {
        # 模型沿用原文件名，要求浏览器重验证，避免更新后仍命中旧模型。
        add_header Cache-Control "public, no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}
