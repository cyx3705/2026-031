name: 刷新项目目录并发布

on:
  # 每天 UTC 20:00 = 北京时间次日 04:00 刷新一次
  schedule:
    - cron: "0 20 * * *"
  # 手动触发
  workflow_dispatch:
  # 改了模板、脚本、配置或样式时立刻重建
  push:
    branches: [main]
    paths:
      - "b-Code/**"
      - "b-Deploy/**"
      - "z-OneHistoryID/typography.json"
      - "z-OneHistoryID/colors.json"
      - "b-Site/index.template.html"
      - "b-Site/library.template.html"
      - "b-Site/p.template.html"
      - "b-Site/assets/**"
      - "b-Site/CNAME"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-site.yml"

permissions:
  contents: write      # 把生成结果提交回仓库

concurrency:
  group: onehistory-shanghai
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typography && npm run colors && npm run test:typography && npm run test:colors

      - name: 从各仓库 README 生成目录与说明页
        run: node b-Code/build.mjs
        env:
          # 带上 token，GitHub API 限额从 60/小时 提到 5000/小时
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交差异
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add b-Site
          if git diff --staged --quiet; then
            echo "目录无变化，跳过提交"
          else
            git commit -m "chore(site): 刷新项目目录 $(date -u +%Y-%m-%d)"
            # 重跑历史 run 时远端可能已被之前的运行推进，先同步再推，
            # 否则 push 会因 non-fast-forward 直接失败
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: 打包站点和预压缩模型
        run: |
          node b-Code/prepare-deploy.mjs
          tar -czf b-Deploy/out/site.tar.gz -C "$(cat b-Deploy/out/latest.txt)" .

      - name: 发布到上海服务器
        env:
          DEPLOY_KEY: ${{ secrets.SHANGHAI_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SHANGHAI_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/onehistory-ssh"
          trap 'rm -f "$RUNNER_TEMP/onehistory-ssh/key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/onehistory-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/onehistory-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/onehistory-ssh/key"
          ssh -T -i "$RUNNER_TEMP/onehistory-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/onehistory-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            root@101.132.190.76 < b-Deploy/out/site.tar.gz

      - name: 验证正式网站
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            --resolve onehistory.exc0.top:443:101.132.190.76 \
            --output /dev/null https://onehistory.exc0.top/
