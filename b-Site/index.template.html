<!DOCTYPE html>
<html lang="zh-Hans" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneHistory · 作品</title>
  <meta name="description" content="/*__LEAD__*/">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
  <script>
    // 以前首页就是项目库，别人分享出去的 /?q=… 筛选链接转到新地址
    if (/[?&](q|g)=/.test(location.search)) location.replace("/library/" + location.search + location.hash);
    // 主题在首帧前定好，避免刷新时闪一下白底
    (function () {
      var t; try { t = localStorage.getItem("oh-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.classList.add("js");
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="is-show">
  <a class="skip" href="#works">跳到代表作品</a>

  <header class="nav">
    <div class="wrap nav-in">
      <a class="nav-logo" href="/" aria-label="OneHistory 首页">
        <img class="logo logo-light" src="/assets/logo.png" alt="OneHistory">
        <img class="logo logo-dark" src="/assets/logo-dark.png" alt="OneHistory">
      </a>
      <span class="grow"></span>
      <a class="nav-link is-on" href="/" aria-current="page">作品</a>
      <a class="nav-link" href="/library/">项目库</a>
      <a class="nav-link" href="https://github.com//*__OWNER__*/" rel="noopener">GitHub</a>
      <a class="nav-link" href="https://exc0.top" rel="noopener">exc0</a>
      <button type="button" id="theme" class="icon-btn" aria-label="切换深浅色" title="切换深浅色">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- 首屏：开放式，模型直接落在页面上做拆装动画，左边是当前作品的说明 -->
    <section class="open-hero" id="top" aria-label="代表作品动画">
      <div class="hero-stage" id="hero-stage">
        <span class="load-bar" id="hero-load"><i></i></span>
        <p class="drag-hint">拖动旋转 · 双击复位</p>
      </div>

      <div class="wrap open-hero-in">
        <div class="slides" aria-live="polite"><!--__SLIDES__-->
        </div>
        <nav class="dots" id="hero-dots" aria-label="切换作品"><!--__HERO_DOTS__--></nav>
      </div>
    </section>

    <!-- 代表作品 -->
    <section class="wrap show-sec" id="works">
      <header class="sec-head">
        <h2>代表作品</h2>
        <span class="ink-bar">名称 · 功能 · 效果图</span>
      </header>
      <div class="features"><!--__FEATURED__-->
      </div>
    </section>

    <!-- 模型展示：选页，只转不拆 -->
    <section class="wrap show-sec" id="models">
      <header class="sec-head">
        <h2>模型展示</h2>
        <span class="ink-bar">选一页 · 拖动旋转</span>
      </header>
      <div class="shelf">
        <div class="shelf-side">
          <div class="pages" id="pages" role="group" aria-label="选择模型"><!--__PAGES__--></div>
          <div class="shelf-cap">
            <p class="shelf-name" id="shelf-name"></p>
            <p class="shelf-note" id="shelf-note"></p>
            <a class="text-link" id="shelf-link" href="#">查看说明 →</a>
          </div>
        </div>
        <div class="shelf-stage" id="shelf-stage">
          <span class="load-bar" id="shelf-load"><i></i></span>
          <p class="page-flip">
            <button type="button" class="icon-btn" id="page-prev" aria-label="上一页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button>
            <span class="page-n" id="page-n"></span>
            <button type="button" class="icon-btn" id="page-next" aria-label="下一页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button>
          </p>
        </div>
      </div>
    </section>

    <!-- 更多机械作品 -->
    <section class="wrap show-sec">
      <header class="sec-head">
        <h2>更多作品</h2>
        <span class="ink-bar">课程设计 · 竞赛 · 专利</span>
      </header>
      <div class="tiles"><!--__MORE__-->
      </div>
    </section>

    <!-- 软件 -->
    <section class="wrap show-sec">
      <header class="sec-head">
        <h2>软件与工具</h2>
        <span class="ink-bar">自研桌面模块与工具</span>
      </header>
      <div class="grid"><!--__SOFTWARE__-->
      </div>

      <div class="to-lib">
        <p><span class="n">/*__COUNT__*/</span> 个公开项目，含学习记录、作业与模板，都在项目库里。</p>
        <a class="ghost-btn" href="/library/">进入项目库 →</a>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap foot-in">
      <p class="foot-note">/*__NOTE__*/</p>
      <p class="foot-meta">
        <span>更新于 /*__BUILT__*/</span>
        <span class="dot"></span>
        <a href="https://github.com//*__OWNER__*/" rel="noopener">GitHub</a>
        <span class="dot"></span>
        <a href="https://exc0.top" rel="noopener">exc0</a>
      </p>
    </div>
  </footer>

  <script src="/assets/site.js"></script>
  <script type="module">
    import { Stage, CYCLE } from "/assets/stage.js";

    // 由 b-Code/build.mjs 根据 site.config.json 的 showcase.hero / showcase.models 生成，请勿手改
    const HERO = /*__HERO__*/;
    const SHELF = /*__SHELF__*/;

    const $ = (id) => document.getElementById(id);
    const loadBar = (el) => (p) => {
      el.firstElementChild.style.transform = "scaleX(" + p + ")";
      el.classList.toggle("done", p >= 1);
    };

    // ---- 首屏：一件转完一轮拆装就换下一件；拖过模型就停在这一件上 ----
    if (HERO.length) {
      const slides = document.querySelectorAll(".slide");
      const dots = document.querySelectorAll(".dot-btn");
      let cur = 0, held = false;

      const hero = new Stage($("hero-stage"), {
        onProgress: loadBar($("hero-load")),
        onInteract: () => { held = true; },
        onTime: (t) => {
          dots[cur].style.setProperty("--p", Math.min(t / CYCLE, 1).toFixed(3));
          if (t >= CYCLE && !held && HERO.length > 1) go((cur + 1) % HERO.length);
        },
      });

      function go(i) {
        cur = i;
        slides.forEach((s, j) => { s.classList.toggle("is-on", j === i); s.hidden = j !== i; });
        dots.forEach((d, j) => { d.classList.toggle("is-on", j === i); d.style.setProperty("--p", 0); });
        hero.show(HERO[i]);
      }

      dots.forEach((d, i) => d.addEventListener("click", () => { held = false; go(i); }));
      // 代表作品里的「看拆装动画」：切到那一件并回到首屏
      document.querySelectorAll("[data-hero]").forEach((b) => b.addEventListener("click", () => {
        const i = HERO.findIndex((m) => m.id === b.dataset.hero);
        if (i < 0) return;
        held = true;
        go(i);
        $("top").scrollIntoView({ behavior: window.OH && window.OH.motion ? "smooth" : "auto" });
      }));
      go(0);
    }

    // ---- 模型展示：滚到附近才建第二块画布，省得首屏一次下太多模型 ----
    if (SHELF.length) {
      const pages = document.querySelectorAll(".page-btn");
      let shelf = null, cur = 0;

      function page(i) {
        cur = (i + SHELF.length) % SHELF.length;
        const m = SHELF[cur];
        pages.forEach((b, j) => { b.classList.toggle("is-on", j === cur); b.setAttribute("aria-pressed", j === cur); });
        $("shelf-name").textContent = m.name + (m.caption ? " · " + m.caption : "");
        $("shelf-note").textContent = m.note;
        $("shelf-link").href = m.url;
        $("page-n").textContent = (cur + 1) + " / " + SHELF.length;
        if (shelf) shelf.show(m);
      }

      pages.forEach((b, i) => b.addEventListener("click", () => page(i)));
      $("page-prev").addEventListener("click", () => page(cur - 1));
      $("page-next").addEventListener("click", () => page(cur + 1));
      page(0);

      const boot = () => {
        if (shelf) return;
        shelf = new Stage($("shelf-stage"), { spin: 0.3, onProgress: loadBar($("shelf-load")) });
        shelf.show(SHELF[cur]);
      };
      if (window.IntersectionObserver) {
        const io = new IntersectionObserver((es) => { if (es[0].isIntersecting) { io.disconnect(); boot(); } }, { rootMargin: "400px 0px" });
        io.observe($("shelf-stage"));
      } else boot();
    }

    if (window.OH && window.OH.reveal) window.OH.reveal(document.querySelectorAll(".card"));
  </script>
</body>
</html>
