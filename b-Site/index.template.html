<!DOCTYPE html>
<html lang="zh-Hans" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneHistory · 作品</title>
  <meta name="description" content="/*__LEAD__*/">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
  <script>
    // 以前首页就是项目库，别人分享出去的 /?q=… 筛选链接转到新地址
    if (/[?&](q|g)=/.test(location.search)) location.replace("/library/" + location.search + location.hash);
    // 主题在首帧前定好，避免刷新时闪一下白底
    (function () {
      var t; try { t = localStorage.getItem("oh-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.classList.add("js");
    })();
  </script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
</head>
<body class="is-show">
  <a class="skip" href="#works">跳到代表作品</a>

  <header class="nav">
    <div class="wrap nav-in">
      <a class="nav-logo" href="/" aria-label="OneHistory 首页">
        <img class="logo logo-light" src="/assets/logo.png" alt="OneHistory">
        <img class="logo logo-dark" src="/assets/logo-dark.png" alt="OneHistory">
      </a>
      <span class="grow"></span>
      <a class="nav-link is-on" href="/" aria-current="page">作品</a>
      <a class="nav-link" href="/library/">项目库</a>
      <a class="nav-link" href="https://github.com//*__OWNER__*/" rel="noopener">GitHub</a>
      <a class="nav-link" href="https://exc0.top" rel="noopener">exc0</a>
      <button type="button" id="theme" class="icon-btn" aria-label="切换深浅色" title="切换深浅色">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- 首屏：左边字标与简介，右边 3D 展台 -->
    <section class="show-hero" id="top">
      <div class="wrap show-hero-in">
        <div class="show-intro">
          <img class="brand logo-light" src="/assets/logo.png" alt="OneHistory">
          <img class="brand logo-dark" src="/assets/logo-dark.png" alt="OneHistory">
          <p class="lead">/*__LEAD__*/</p>

          <dl class="tblock">
            <div><dt>精选作品</dt><dd class="n">/*__WORKS__*/</dd></div>
            <div><dt>公开项目</dt><dd class="n">/*__COUNT__*/</dd></div>
            <div><dt>GitHub</dt><dd><a href="https://github.com//*__OWNER__*/" rel="noopener">github.com//*__OWNER__*/</a></dd></div>
          </dl>

          <p class="show-cta">
            <a class="solid-btn" href="#works">看代表作品</a>
            <a class="ghost-btn" href="/library/">进入项目库 →</a>
          </p>
        </div>

        <figure class="stage" id="stage" aria-label="3D 模型展台">
          <div class="stage-view">
            <model-viewer id="viewer" camera-controls auto-rotate auto-rotate-delay="1500" rotation-per-second="18deg"
              touch-action="pan-y" interaction-prompt="none" shadow-intensity="0.9" shadow-softness="0.8"
              exposure="1.05" environment-image="neutral" camera-orbit="35deg 72deg auto" alt="作品三维模型"></model-viewer>
            <div class="stage-load" id="stage-load"><span class="stage-bar" id="stage-bar"></span></div>
            <p class="stage-hint">拖动旋转 · 滚轮缩放 · 双击复位</p>
          </div>
          <figcaption class="stage-foot">
            <div class="stage-tabs" id="stage-tabs" role="group" aria-label="切换模型"><!--__MODEL_TABS__--></div>
            <p class="stage-cap"><span id="stage-cap"></span><a id="stage-link" href="#">查看说明 →</a></p>
          </figcaption>
        </figure>
      </div>
    </section>

    <!-- 代表作品 -->
    <section class="wrap show-sec" id="works">
      <header class="sec-head">
        <h2>代表作品</h2>
        <span class="ink-bar">名称 · 功能 · 效果图</span>
      </header>
      <div class="features"><!--__FEATURED__-->
      </div>
    </section>

    <!-- 更多机械作品 -->
    <section class="wrap show-sec">
      <header class="sec-head">
        <h2>更多作品</h2>
        <span class="ink-bar">课程设计 · 竞赛 · 专利</span>
      </header>
      <div class="tiles"><!--__MORE__-->
      </div>
    </section>

    <!-- 软件 -->
    <section class="wrap show-sec">
      <header class="sec-head">
        <h2>软件与工具</h2>
        <span class="ink-bar">自研桌面模块与工具</span>
      </header>
      <div class="grid"><!--__SOFTWARE__-->
      </div>

      <div class="to-lib">
        <p><span class="n">/*__COUNT__*/</span> 个公开项目，含学习记录、作业与模板，都在项目库里。</p>
        <a class="ghost-btn" href="/library/">进入项目库 →</a>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap foot-in">
      <p class="foot-note">/*__NOTE__*/</p>
      <p class="foot-meta">
        <span>更新于 /*__BUILT__*/</span>
        <span class="dot"></span>
        <a href="https://github.com//*__OWNER__*/" rel="noopener">GitHub</a>
        <span class="dot"></span>
        <a href="https://exc0.top" rel="noopener">exc0</a>
      </p>
    </div>
  </footer>

  <script src="/assets/site.js"></script>
  <script>
  (function () {
    // 由 b-Code/build.mjs 根据 site.config.json 的 showcase.models 生成，请勿手改
    var MODELS = /*__MODELS__*/;

    var stage = document.getElementById("stage");
    var viewer = document.getElementById("viewer");
    var tabs = document.getElementById("stage-tabs");
    var cap = document.getElementById("stage-cap");
    var link = document.getElementById("stage-link");
    var load = document.getElementById("stage-load");
    var bar = document.getElementById("stage-bar");

    if (!MODELS.length) { stage.classList.add("hidden"); return; }
    // 「减少动效」下不自转，只在拖动时转
    if (window.OH && !window.OH.motion) viewer.removeAttribute("auto-rotate");

    function show(id) {
      var m = MODELS.filter(function (x) { return x.id === id; })[0] || MODELS[0];
      if (viewer.getAttribute("src") !== m.file) {
        load.classList.remove("done");
        bar.style.transform = "scaleX(0)";
        viewer.setAttribute("orientation", m.orientation || "0deg 0deg 0deg");
        viewer.setAttribute("src", m.file);
        viewer.setAttribute("alt", m.name + " 三维模型");
      }
      cap.textContent = m.name + " · " + (m.caption || "");
      link.href = m.url;
      tabs.querySelectorAll(".stage-tab").forEach(function (b) {
        var on = b.dataset.model === m.id;
        b.classList.toggle("is-on", on);
        b.setAttribute("aria-pressed", on);
      });
    }

    viewer.addEventListener("progress", function (e) {
      var p = e.detail.totalProgress || 0;
      bar.style.transform = "scaleX(" + p + ")";
      if (p >= 1) load.classList.add("done");
    });
    // 双击回到初始视角
    viewer.addEventListener("dblclick", function () {
      viewer.cameraOrbit = "35deg 72deg auto";
      viewer.fieldOfView = "auto";
      viewer.cameraTarget = "auto auto auto";
    });

    tabs.addEventListener("click", function (e) {
      var b = e.target.closest(".stage-tab");
      if (b) show(b.dataset.model);
    });

    // 作品条目里的「在 3D 展台查看」：切模型并滚回首屏
    document.querySelectorAll(".text-btn[data-model]").forEach(function (b) {
      b.addEventListener("click", function () {
        show(b.dataset.model);
        stage.scrollIntoView({ behavior: window.OH && window.OH.motion ? "smooth" : "auto", block: "center" });
      });
    });

    show(MODELS[0].id);

    if (window.OH && window.OH.reveal) window.OH.reveal(document.querySelectorAll(".card"));
  })();
  </script>
</body>
</html>
