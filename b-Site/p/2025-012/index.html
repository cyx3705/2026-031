<h1>2025-012-小型作业集合</h1>
<p>小型作业统一管理模板，所有作业分支继承本项目结构规范</p>
<h2>目录结构</h2>
<ul>
<li>Body/：全部作业主体文件</li>
<li>Note：作业思路、临时草稿记录</li>
</ul>
<h2>使用方法</h2>
<ol>
<li>以此仓库为基底创建独立分支存放不同作业</li>
<li>全部作业内容统一放入Body文件夹，以根目录INDEX为入口</li>
<li>零散解题记录统一写入Note文件</li>
</ol>
<h2>保留内容</h2>
<ul>
<li>本模板项目介绍：此为最初的准备的项目模板
