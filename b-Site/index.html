    // ---- 分组：全部由编号推导，新年份自动出现，不维护任何名单 ----
    function groupOf(p) {
      var m = String(p.id).match(/^(\d{4})/);
      if (!m) return { key: "other", label: "其他", rank: 1 };
      if (m[1] === "0000") return { key: "0000", label: "模板", rank: 2 };
      return { key: m[1], label: m[1], rank: 0 };
    }

    function buildChips() {
      var seen = {};
      PROJECTS.forEach(function (p) {
        var g = groupOf(p);
        if (!seen[g.key]) seen[g.key] = { key: g.key, label: g.label, rank: g.rank, n: 0 };
        seen[g.key].n++;
      });
      var list = Object.keys(seen).map(function (k) { return seen[k]; });
      // 年份倒序在前，模板与其他垫后
      list.sort(function (a, b) {
        if (a.rank !== b.rank) return a.rank - b.rank;
        return a.key < b.key ? 1 : a.key > b.key ? -1 : 0;
      });
      list.unshift({ key: "all", label: "全部", n: PROJECTS.length });

      chipsBox.innerHTML = list.map(function (g) {
        return '<button type="button" class="chip' + (g.key === state.group ? " is-on" : "") +
          '" data-group="' + g.key + '" aria-pressed="' + (g.key === state.group) + '">' +
          g.label + '<span class="chip-n">' + g.n + '</span></button>';
      }).join("");
    }

    // ---- 相对时间 ----
    function ago(iso) {
      if (!iso) return "";
      var t = Date.parse(iso);
      if (isNaN(t)) return "";
      var d = Math.floor((Date.now() - t) / 86400000);
      if (d <= 0) return "今天";
      if (d === 1) return "昨天";
      if (d < 30) return d + " 天前";
      if (d < 365) return Math.floor(d / 30) + " 个月前";
      return Math.floor(d / 365) + " 年前";
    }

        : (t ? '<time datetime="' + esc(p.pushed) + '">' + t + '</time>' : '<span></span>');
      return '<article class="card" style="--i:' + i + '">' +
        '<a class="card-link" href="' + esc(p.url) + '"' + (p.ext ? ' rel="noopener"' : '') + '>' +
          '<span class="id">' + esc(p.id) + '</span>' +
          '<h3>' + esc(p.name) + '</h3>' +
          '<p>' + esc(p.note) + '</p>' +
        '</a>' +
        '<footer class="card-foot">' + meta +
          '<a class="repo" href="https://github.com/' + esc(p.repo) + '" rel="noopener" ' +
            'aria-label="在 GitHub 打开 ' + esc(p.name) + '" title="在 GitHub 打开">' +
            (p.ext ? ICON_ARROW : ICON_GH) +
          '</a>' +
        '</footer>' +
      '</article>';
    }

    // ---- 过滤 / 排序 / 渲染 ----
    function match(p, q) {
      if (!q) return true;
      return (p.id + " " + p.name + " " + p.note + " " + p.repo).toLowerCase().indexOf(q) >= 0;
    }

    function render() {
      var q = state.q.trim().toLowerCase();
      var list = PROJECTS.filter(function (p) {
        if (state.group !== "all" && groupOf(p).key !== state.group) return false;
        return match(p, q);
      });

      list.sort(function (a, b) {
        if (state.sort === "fresh") {
          var ta = Date.parse(a.pushed || "") || 0, tb = Date.parse(b.pushed || "") || 0;
          if (ta !== tb) return tb - ta;
        }
        return a.id < b.id ? 1 : a.id > b.id ? -1 : 0;
      });

      grid.innerHTML = list.map(card).join("");
      emptyEl.classList.toggle("hidden", list.length > 0);
      countEl.textContent = (q || state.group !== "all")
        ? "匹配 " + list.length + " / " + PROJECTS.length + " 个项目"
        : "共 " + PROJECTS.length + " 个项目";

      if (window.OH && window.OH.reveal) window.OH.reveal(grid.children);
    }

    function setQ(v, from) {
      state.q = v;
      if (from !== "hero" && heroQ.value !== v) heroQ.value = v;
      if (from !== "bar" && barQ.value !== v) barQ.value = v;
      render();
      syncUrl();
    }

    function syncUrl() {
      if (!history.replaceState) return;
      var p = new URLSearchParams();
      if (state.q.trim()) p.set("q", state.q.trim());
      if (state.group !== "all") p.set("g", state.group);
      var s = p.toString();
      history.replaceState(null, "", s ? "?" + s + location.hash : location.pathname + location.hash);
    }

    // ---- 首屏数据条 ----
    (function stats() {
      document.getElementById("stat-count").textContent = PROJECTS.length;
      var newest = "";
      PROJECTS.forEach(function (p) { if (p.pushed && p.pushed > newest) newest = p.pushed; });
      document.getElementById("stat-fresh").textContent = newest ? ago(newest) : BUILT;
    })();

    // ---- 事件 ----
    heroQ.addEventListener("input", function () { setQ(this.value, "hero"); });
    barQ.addEventListener("input", function () { setQ(this.value, "bar"); });

    // 首屏里一开始打字就滑到项目库，省掉一次手动下拉
    var jumped = false;
    heroQ.addEventListener("input", function () {
      if (jumped || !this.value) return;
      jumped = true;
      document.getElementById("library").scrollIntoView({ behavior: window.OH && window.OH.motion ? "smooth" : "auto", block: "start" });
    });
    heroQ.addEventListener("blur", function () { if (!this.value) jumped = false; });

    document.getElementById("hero-form").addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("library").scrollIntoView({ behavior: window.OH && window.OH.motion ? "smooth" : "auto", block: "start" });
    });
    document.getElementById("bar-form").addEventListener("submit", function (e) { e.preventDefault(); });

    chipsBox.addEventListener("click", function (e) {
      var b = e.target.closest(".chip");
      if (!b) return;
      state.group = b.dataset.group;
      chipsBox.querySelectorAll(".chip").forEach(function (x) {
        var on = x === b;
        x.classList.toggle("is-on", on);
        x.setAttribute("aria-pressed", on);
      });
      render();
      syncUrl();
    });

    document.querySelectorAll(".sort-btn").forEach(function (b) {
      b.addEventListener("click", function () {
        state.sort = b.dataset.sort;
        document.querySelectorAll(".sort-btn").forEach(function (x) { x.classList.toggle("is-on", x === b); });
        render();
      });
    });

    document.getElementById("reset").addEventListener("click", function () {
      state.group = "all";
      buildChips();
      setQ("");
      barQ.focus();
    });

    // `/` 聚焦搜索，Esc 清空
    document.addEventListener("keydown", function (e) {
      var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        var top = window.scrollY < window.innerHeight * 0.6;
        (top ? heroQ : barQ).focus();
      } else if (e.key === "Escape" && typing) {
        setQ("");
        document.activeElement.blur();
      }
    });

    // ---- 起始状态：允许用 ?q= / ?g= 分享一个筛好的视图 ----
    (function boot() {
      var p = new URLSearchParams(location.search);
      state.q = p.get("q") || "";
      state.group = p.get("g") || "all";
      heroQ.value = barQ.value = state.q;
      buildChips();
      render();
    })();
  })();
  </script>
</body>
</html>
